name: Check public content
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check-public-content.py
      - run: node --test lk/tests/*.cjs utm/tests/*.mjs tests/*.cjs
